<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Settings | The Khabar Thread CMS</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <div class="admin-topbar">
    <div class="admin-topbar-inner">
      <a href="dashboard.html" class="admin-brand"><span class="dot"></span>The Khabar Thread <span style="color:var(--muted);font-weight:600;">CMS</span></a>
      <nav class="admin-nav">
        <a href="dashboard.html"><i class="fas fa-grip"></i> Dashboard</a>
        <a href="add-news.html"><i class="fas fa-plus"></i> Add News</a>
        <a href="all-news.html"><i class="fas fa-newspaper"></i> All News</a>
        <a href="ads.html"><i class="fas fa-bullhorn"></i> Ads</a>
        <button id="logoutBtn" class="logout-link"><i class="fas fa-right-from-bracket"></i> Logout</button>
      </nav>
    </div>
  </div>

  <main class="container">
    <header class="admin-header">
      <div>
        <h1>Settings</h1>
        <p>Account और website connection की जानकारी</p>
      </div>
    </header>

    <section class="recent-box">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;">
        <img id="profilePhoto" src="" alt="Admin profile" width="72" height="72" style="border-radius:50%;" hidden>
        <div id="profilePhotoFallback" class="admin-icon"><i class="fas fa-user"></i></div>
        <div>
          <h2 id="profileName" style="margin:0;">Admin</h2>
          <p id="profileEmail" style="margin:4px 0 0;">Loading…</p>
        </div>
      </div>
      <div class="status success"><i class="fas fa-circle-check"></i> Firebase project: <strong id="firebaseProjectId">—</strong></div>
      <div class="status success"><i class="fas fa-shield-halved"></i> Google verified admin authentication active</div>
      <div class="status success"><i class="fas fa-cloud-arrow-up"></i> Cloudinary signed uploads active after Worker secrets are configured</div>
      <button id="logoutBtn2" class="logout-link" style="margin-top:24px;"><i class="fas fa-right-from-bracket"></i> Logout</button>
    </section>
  </main>
  <script type="module" src="../js/settings.js"></script>
</body>
</html>
