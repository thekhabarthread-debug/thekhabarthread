name: Update Sitemap

# Yeh workflow "scripts/generate-sitemap.js" ko:
#   1. Har 6 ghante me automatically chalata hai
#   2. GitHub repo ke "Actions" tab se manually bhi chalaya ja sakta hai
#      ("Run workflow" button — workflow_dispatch)
# Naya sitemap.xml agar pehle se alag hai, to woh seedha
# repository me commit ho jaata hai, aur GitHub Pages usse
# automatically live kar deta hai.

on:
  schedule:
    - cron: "0 */6 * * *" # Har 6 ghante me (UTC time)
  workflow_dispatch: {} # Manually "Run workflow" button se chalane ke liye
  push:
    branches: [main]
    paths:
      - "scripts/generate-sitemap.js"
      - ".github/workflows/update-sitemap.yml"

permissions:
  contents: write # sitemap.xml commit/push karne ke liye zaroori

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.js

      - name: Commit and push if sitemap changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "Koi badlaav nahi — sitemap already up to date hai."
          else
            git commit -m "chore: auto-update sitemap.xml [skip ci]"
            git push
          fi
